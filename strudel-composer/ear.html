<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strudel Ear</title>
<style>
  :root { --bg: #0e0e10; --fg: #ddd; --dim: #888; --line: #333; --bad: #ff5a5a; --ok: #6fdc8c; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; margin: 16px; }
  textarea { width: 100%; height: 160px; background: #000; color: var(--fg); border: 1px solid var(--line); font: inherit; }
  canvas { width: 100%; display: block; margin: 8px 0; }
  pre { white-space: pre-wrap; margin: 0; }
  a { color: #8ab4ff; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  #status.bad { color: var(--bad); } #status.ok { color: var(--ok); }
</style>
</head>
<body>
<textarea id="code" spellcheck="false" placeholder="Strudel code. Optional header: // @cycles 32  // @section 4"></textarea>
<div class="bar">
  <button id="go">render</button>
  <span id="status">loading strudel…</span>
  <a id="share" target="_blank" rel="noopener" hidden>open in strudel.cc</a>
  <a id="wav" download="track.wav" hidden>download wav</a>
  <audio id="player" controls hidden></audio>
</div>
<canvas id="spec" width="1600" height="640"></canvas>
<pre id="out"></pre>
<div id="compare"></div>

<script type="module">
import * as S from 'https://cdn.jsdelivr.net/npm/@strudel/web@1.3.0/dist/index.mjs';

// Same sample banks as strudel.cc, so a share link sounds like the render.
const DS = 'https://raw.githubusercontent.com/felixroos/dough-samples/main';
const ready = S.initStrudel({
  prebake: () => Promise.all(['tidal-drum-machines', 'piano', 'Dirt-Samples', 'vcsl'].map((f) => S.samples(`${DS}/${f}.json`))),
});

const $ = (id) => document.getElementById(id);
const MAX_CYCLES = 128;
const N = 2048, HOP = 1024, ROWS = 220, FMIN = 30, FMAX = 16000;
const BANDS = { sub: [20, 60], low: [60, 250], mid: [250, 2000], high: [2000, 8000], air: [8000, 20000] };

// Strudel reports eval errors and missing sounds only through its logger.
let log = [], lastWav = null;
document.addEventListener('strudel.log', (e) => log.push(e.detail));

const shareUrl = (code) =>
  'https://strudel.cc/#' + encodeURIComponent(btoa(String.fromCharCode(...new TextEncoder().encode(code))));

const header = (code, key) => Number(code.match(new RegExp(`@${key}\\s+(\\d+)`))?.[1]) || undefined;

// superdough builds reverb impulses in their own OfflineAudioContext and sets convolver.buffer from a callback.
// Nothing waits for them in an offline render, so the reverb was randomly missing. Hold each render until its impulses exist.
const convolvers = new Set();
const createReverb = BaseAudioContext.prototype.createReverb;
BaseAudioContext.prototype.createReverb = function (...args) {
  const c = createReverb.apply(this, args);
  convolvers.add(c);
  return c;
};
// Samples load lazily, and a note whose sample arrives after rendering started is dropped ("took too long").
// Count downloads and decodes in flight, and hold each render until they are done.
let inflight = 0;
const track = (p) => { inflight++; return p.finally(() => inflight--); };
const fetchRaw = window.fetch, arrayBuffer = Response.prototype.arrayBuffer, decode = BaseAudioContext.prototype.decodeAudioData;
window.fetch = (...args) => track(fetchRaw(...args));
Response.prototype.arrayBuffer = function () { return track(arrayBuffer.call(this)); };
BaseAudioContext.prototype.decodeAudioData = function (...args) { return track(decode.apply(this, args)); };

const nextTask = () => new Promise((r) => { const ch = new MessageChannel(); ch.port1.onmessage = r; ch.port2.postMessage(0); }); // not throttled in hidden tabs
const startRendering = OfflineAudioContext.prototype.startRendering;
OfflineAudioContext.prototype.startRendering = async function () {
  const t0 = performance.now();
  const busy = () => inflight > 0 || [...convolvers].some((c) => c.context === this && !c.buffer);
  while (busy() && performance.now() - t0 < 30000) await nextTask();
  for (const c of convolvers) if (c.context === this) convolvers.delete(c);
  return startRendering.call(this);
};

// superdough pools filter and synth nodes in a global map with no context check. A node released by one chunk's
// context got reused in the next chunk's context, the connect failed and the note vanished, at random chunks.
// The pool holds WeakRefs: make nodes of a finished (closed) context look garbage-collected so a fresh one is built.
const WeakRefRaw = window.WeakRef;
window.WeakRef = class extends WeakRefRaw {
  deref() {
    const t = super.deref();
    return t instanceof AudioNode && t.context.state === 'closed' ? undefined : t;
  }
};

// renderPatternAudio downloads the WAV through a temporary link: keep the blob, skip the download.
async function captureWav(run) {
  const createUrl = URL.createObjectURL, click = HTMLAnchorElement.prototype.click;
  let blob;
  URL.createObjectURL = (b) => ((blob = b), createUrl.call(URL, b));
  HTMLAnchorElement.prototype.click = function () { if (!this.download) click.call(this); };
  try { await run(); } finally { URL.createObjectURL = createUrl; HTMLAnchorElement.prototype.click = click; }
  return blob;
}

async function render(code, opts = {}) {
  code ??= $('code').value;
  $('code').value = code;
  const cycles = Math.min(opts.cycles ?? header(code, 'cycles') ?? 16, MAX_CYCLES);
  const section = opts.section ?? header(code, 'section') ?? 4;
  status('rendering…');
  const repl = await ready;
  log = [];
  repl.scheduler.setCps(0.5); // default tempo unless the code sets one
  const pattern = await repl.evaluate(code, false);
  const evalError = log.find((l) => l.type === 'error' && /\[eval\]/.test(l.message))?.message;
  if (!pattern || evalError) return finish({ ok: false, error: evalError ?? 'evaluation failed', share: shareUrl(code) });
  const cps = repl.scheduler.cps;
  const t0 = performance.now();
  const buf = await renderChunks(pattern, cps, cycles);
  const renderMs = Math.round(performance.now() - t0);
  const missing = [...new Set(log.map((l) => l.message.match(/sound (\S+) not found/)?.[1]).filter(Boolean))];
  const errors = [...new Set(log.filter((l) => l.type === 'error').map((l) => l.message))].slice(0, 5);
  if (!buf) return finish({ ok: false, error: errors[0] ?? 'render produced no audio', missing, share: shareUrl(code) });
  const { onsets: _, ...a } = analyze(buf, cps, section);
  a.global.renderMs = renderMs;
  if (missing.length) a.flags.unshift({ id: 'missing-sound', detail: missing.join(', '), fix: 'use only sounds from the SKILL.md palette' });
  if (opts.stems) a.stems = await stems(repl, code, cycles);
  lastWav = new Blob([wav(buf)], { type: 'audio/wav' });
  const url = URL.createObjectURL(lastWav);
  Object.assign($('wav'), { href: url, hidden: false });
  Object.assign($('player'), { src: url, hidden: false });
  return finish({ ok: !missing.length, error: null, missing, errors, ...a, share: shareUrl(code) });
}

// Solo each `$:` layer (the others muted with `_$:`) to tell which one is loud, clips or fills the low end.
async function stems(repl, code, cycles) {
  const lines = code.split('\n');
  const starts = lines.flatMap((l, i) => (/^\s*\$:/.test(l) ? [i] : []));
  const out = [];
  for (const [k, s] of starts.entries()) {
    status(`stem ${k + 1}/${starts.length}…`);
    const solo = lines.map((l, i) => (i !== s && starts.includes(i) ? l.replace('$:', '_$:') : l)).join('\n');
    const pattern = await repl.evaluate(solo, false);
    const buf = pattern && (await renderChunks(pattern, repl.scheduler.cps, cycles));
    if (!buf) continue;
    const { peakDb, rmsDb, bands } = analyze(buf, repl.scheduler.cps, cycles, false).global;
    out.push({ layer: k + 1, code: lines[s].replace('$:', '').trim().slice(0, 50), peakDb, rmsDb, bands });
  }
  return out;
}

// Offline cost grows with notes x duration: every scheduled note stays in the graph until the end.
// Render 4-cycle chunks plus a tail and sum them. Effects are per note and linear, so the sum matches a one-shot render.
const CHUNK = 4, SR = 44100;
async function renderChunks(pattern, cps, cycles) {
  const tail = Math.max(2, 6 * cps); // in cycles, at least 6 s of reverb and delay
  const out = new AudioBuffer({ numberOfChannels: 2, length: Math.ceil((cycles / cps) * SR), sampleRate: SR });
  for (let b = 0; b < cycles; b += CHUNK) {
    const e = Math.min(b + CHUNK, cycles);
    status(`rendering ${e}/${cycles} cycles…`);
    const part = pattern.filterHaps((h) => h.whole && h.whole.begin.valueOf() >= b && h.whole.begin.valueOf() < e);
    // Offline, every note of the chunk is scheduled at once: the default 128-voice cap would cut notes.
    const blob = await captureWav(() => S.renderPatternAudio(part, cps, b, Math.min(e + tail, cycles), SR, 4096, false, 'track'));
    if (!blob) return null;
    const chunk = await new OfflineAudioContext(2, 1, SR).decodeAudioData(await blob.arrayBuffer());
    const off = Math.round((b / cps) * SR);
    for (let c = 0; c < 2; c++) {
      const src = chunk.getChannelData(Math.min(c, chunk.numberOfChannels - 1)), dst = out.getChannelData(c);
      for (let i = 0; i < src.length && off + i < dst.length; i++) dst[off + i] += src[i];
    }
  }
  return out;
}

function wav(buf) {
  const n = buf.length, dv = new DataView(new ArrayBuffer(44 + n * 4));
  const str = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); str(8, 'WAVE'); str(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, buf.sampleRate, true);
  dv.setUint32(28, buf.sampleRate * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true);
  str(36, 'data'); dv.setUint32(40, n * 4, true);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  for (let i = 0, o = 44; i < n; i++, o += 4) {
    dv.setInt16(o, Math.max(-1, Math.min(1, L[i])) * 32767, true);
    dv.setInt16(o + 2, Math.max(-1, Math.min(1, R[i])) * 32767, true);
  }
  return dv.buffer;
}

function finish(result) {
  Object.assign($('share'), { href: result.share, hidden: false });
  status(result.ok ? `ok · ${result.flags?.length ?? 0} flag(s)` : `error: ${result.error ?? result.missing?.join(', ')}`, result.ok);
  $('out').textContent = report(result);
  window.ear.result = result;
  return result;
}

function status(text, ok) {
  $('status').textContent = text;
  $('status').className = ok === undefined ? '' : ok ? 'ok' : 'bad';
}

// ---------- analysis ----------

function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (-2 * Math.PI) / len, wr = Math.cos(ang), wi = Math.sin(ang), half = len >> 1;
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < half; k++) {
        const a = i + k, b = a + half;
        const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
      }
    }
  }
}

const db = (p) => 10 * Math.log10(p + 1e-12);
const r1 = (x) => Math.round(x * 10) / 10;

function analyze(buf, cps, sectionCycles, canvas = $('spec')) {
  const sr = buf.sampleRate, L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
  const len = L.length, binHz = sr / N, bins = N / 2;

  let peak = 0, sumSq = 0, clipped = 0, mid2 = 0, side2 = 0;
  for (let i = 0; i < len; i++) {
    const l = L[i], r = R[i], a = Math.max(Math.abs(l), Math.abs(r));
    if (a > peak) peak = a;
    if (a >= 0.999) clipped++;
    const m = (l + r) / 2, s = (l - r) / 2;
    mid2 += m * m; side2 += s * s; sumSq += (l * l + r * r) / 2;
  }

  const win = Float32Array.from({ length: N }, (_, i) => 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (N - 1)));
  const rowRange = Array.from({ length: ROWS }, (_, r) => {
    const f = (x) => FMIN * Math.pow(FMAX / FMIN, x / (ROWS - 1));
    const b0 = Math.max(1, Math.round(f(r - 0.5) / binHz)), b1 = Math.max(b0, Math.round(f(r + 0.5) / binHz));
    return [b0, Math.min(b1, bins - 1)];
  });
  const bandRange = Object.fromEntries(Object.entries(BANDS).map(([k, [a, b]]) => [k, [Math.ceil(a / binHz), Math.min(bins - 1, Math.floor(b / binHz))]]));

  const nFrames = Math.max(1, Math.floor((len - N) / HOP) + 1);
  const cols = new Array(nFrames), frameDb = new Float32Array(nFrames), flux = new Float32Array(nFrames), frameSec = new Int32Array(nFrames);
  const nSec = Math.max(1, Math.ceil((len / sr) * cps / sectionCycles - 1e-3)); // tolerance: length is rounded up to whole samples
  const sec = Array.from({ length: nSec }, () => ({ frames: 0, sumSq: 0, peak: 0, bands: { sub: 0, low: 0, mid: 0, high: 0, air: 0 }, fp: 0, p: 0, prof: new Float64Array(22), onsets: 0 }));
  const re = new Float32Array(N), im = new Float32Array(N);
  let prevMag = new Float32Array(bins), silent = 0;

  for (let f = 0; f < nFrames; f++) {
    const o = f * HOP;
    let fs = 0, fpk = 0;
    for (let i = 0; i < N; i++) {
      const x = (L[o + i] + R[o + i]) / 2;
      fs += x * x; fpk = Math.max(fpk, Math.abs(L[o + i]), Math.abs(R[o + i]));
      re[i] = x * win[i]; im[i] = 0;
    }
    fft(re, im);
    const s = sec[Math.min(nSec - 1, Math.floor(((o + N / 2) / sr) * cps / sectionCycles))];
    frameSec[f] = sec.indexOf(s);
    frameDb[f] = db(fs / N);
    if (frameDb[f] < -60) silent++;
    s.frames++; s.sumSq += fs / N; s.peak = Math.max(s.peak, fpk);

    const P = new Float32Array(bins), mag = new Float32Array(bins);
    let fl = 0;
    for (let k = 1; k < bins; k++) {
      P[k] = (re[k] * re[k] + im[k] * im[k]) / N;
      mag[k] = Math.log1p(100 * Math.sqrt(P[k]));
      fl += Math.max(0, mag[k] - prevMag[k]);
      s.fp += k * binHz * P[k]; s.p += P[k];
    }
    flux[f] = fl; prevMag = mag;
    for (const [k, [a, b]] of Object.entries(bandRange)) for (let i = a; i <= b; i++) s.bands[k] += P[i];

    const col = new Float32Array(ROWS);
    for (let r = 0; r < ROWS; r++) {
      let m = 0;
      for (let i = rowRange[r][0]; i <= rowRange[r][1]; i++) m = Math.max(m, P[i]);
      col[r] = db(m);
      s.prof[Math.min(21, (r / 10) | 0)] += m;
    }
    cols[f] = col;
  }

  // ponytail: global flux threshold + local max, good enough for counting attacks; per-band onset detection if needed
  const mean = flux.reduce((a, b) => a + b, 0) / nFrames;
  const sd = Math.sqrt(flux.reduce((a, b) => a + (b - mean) ** 2, 0) / nFrames);
  const onsetFrames = [];
  for (let f = 1; f < nFrames - 1; f++)
    if (flux[f] > mean + 0.5 * sd && flux[f] > flux[f - 1] && flux[f] >= flux[f + 1]) { sec[frameSec[f]].onsets++; onsetFrames.push(f); }

  const sections = sec.map((s, i) => {
    const total = Object.values(s.bands).reduce((a, b) => a + b, 0) || 1e-12;
    const secs = (s.frames * HOP) / sr || 1e-9;
    return {
      cycles: `${i * sectionCycles}-${Math.min((i + 1) * sectionCycles, r1((len / sr) * cps))}`,
      rmsDb: r1(db(s.sumSq / Math.max(1, s.frames))),
      peakDb: r1(20 * Math.log10(s.peak + 1e-9)),
      bands: Object.fromEntries(Object.entries(s.bands).map(([k, v]) => [k, r1((100 * v) / total)])),
      centroidHz: Math.round(s.fp / (s.p || 1e-12)),
      onsetsPerSec: r1(s.onsets / secs),
      profDb: Array.from(s.prof, (v) => db(v / Math.max(1, s.frames))),
    };
  });
  // novelty: mean |dB change| over 22 log bands (12 dB = 1.0), or change in attack rate, whichever is larger
  sections.forEach((s, i) => {
    if (!i) return (s.novelty = null);
    const p = sections[i - 1];
    const spec = s.profDb.reduce((a, v, k) => a + Math.abs(Math.max(v, -90) - Math.max(p.profDb[k], -90)), 0) / 22 / 12;
    const rate = Math.abs(s.onsetsPerSec - p.onsetsPerSec) / Math.max(s.onsetsPerSec, p.onsetsPerSec, 1);
    s.novelty = Math.round(Math.min(1, Math.max(spec, rate)) * 100) / 100;
  });
  sections.forEach((s) => delete s.profDb);

  const totalBands = sec.reduce((acc, s) => { for (const k in s.bands) acc[k] += s.bands[k]; return acc; }, { sub: 0, low: 0, mid: 0, high: 0, air: 0 });
  const tb = Object.values(totalBands).reduce((a, b) => a + b, 0) || 1e-12;
  const global = {
    seconds: r1(len / sr), cps: Math.round(cps * 1000) / 1000, bpm: Math.round(cps * 240), cycles: r1((len / sr) * cps),
    peakDb: r1(20 * Math.log10(peak + 1e-9)), rmsDb: r1(db(sumSq / len)),
    crestDb: r1(20 * Math.log10(peak + 1e-9) - db(sumSq / len)), clipped,
    silencePct: Math.round((100 * silent) / nFrames), width: Math.round((side2 / (mid2 || 1e-12)) * 100) / 100,
    bands: Object.fromEntries(Object.entries(totalBands).map(([k, v]) => [k, r1((100 * v) / tb)])),
  };

  const flags = [];
  const flag = (id, detail, fix) => flags.push({ id, detail, fix });
  if (global.peakDb > -0.3 || clipped) flag('clipping', `peak ${global.peakDb} dBFS, ${clipped} clipped samples`, 'lower .gain on the loudest layers, or .postgain(0.7) on the whole stack');
  if (global.rmsDb < -28) flag('too-quiet', `rms ${global.rmsDb} dBFS`, 'raise layer gains');
  if (global.rmsDb > -9) flag('too-loud', `rms ${global.rmsDb} dBFS`, 'lower gains, fewer simultaneous layers');
  if (global.bands.sub + global.bands.low > 85) flag('muddy', `sub+low ${r1(global.bands.sub + global.bands.low)}%`, '.hpf(150) on pads/chords/leads, keep only kick and bass below 120 Hz');
  if (global.bands.high + global.bands.air < 1.5) flag('dull', `high+air ${r1(global.bands.high + global.bands.air)}%`, 'add hats/shakers or open filters (.lpf higher)');
  const maxNov = Math.max(0, ...sections.map((s) => s.novelty ?? 0));
  if (sections.length > 1 && maxNov < 0.05) flag('static', `max section novelty ${maxNov}`, 'arrange sections: layers entering/leaving via arrange() or mask(), filter moves, breaks');
  if (global.silencePct > 20) flag('silence', `${global.silencePct}% of frames below -60 dB`, 'fill gaps or shorten');
  if (global.width < 0.02) flag('mono', `side/mid ${global.width}`, '.pan(), .jux(rev) or stereo delay on some layers');

  if (canvas) draw(canvas, cols, frameDb, onsetFrames, nFrames, sr, cps, sectionCycles, sections, clippedFrames(L, R, nFrames));
  return { global, sections, flags, onsets: onsetFrames.map((f) => (f * HOP + N / 2) / sr) };
}

function clippedFrames(L, R, nFrames) {
  const out = [];
  for (let f = 0; f < nFrames; f++) {
    for (let i = f * HOP, e = i + HOP; i < e && i < L.length; i++) if (Math.abs(L[i]) >= 0.999 || Math.abs(R[i]) >= 0.999) { out.push(f); break; }
  }
  return out;
}

// ---------- drawing ----------

const STOPS = [[0, 0, 4], [60, 15, 112], [150, 40, 128], [228, 90, 95], [252, 170, 105], [252, 253, 191]];
function color(v) {
  const x = Math.max(0, Math.min(1, v)) * (STOPS.length - 1), i = Math.min(STOPS.length - 2, x | 0), t = x - i;
  return STOPS[i].map((c, k) => c + (STOPS[i + 1][k] - c) * t);
}

function draw(cv, cols, frameDb, onsetFrames, nFrames, sr, cps, sectionCycles, sections, clips) {
  const g = cv.getContext('2d');
  const X = 48, Y = 22, W = cv.width - X - 8, H = 420, LY = Y + H + 14, LH = 150;
  g.fillStyle = '#0e0e10'; g.fillRect(0, 0, cv.width, cv.height);

  let top = -200;
  for (const c of cols) for (const v of c) top = Math.max(top, v);
  const img = g.createImageData(W, H);
  for (let x = 0; x < W; x++) {
    const f0 = Math.floor((x / W) * nFrames), f1 = Math.max(f0 + 1, Math.floor(((x + 1) / W) * nFrames));
    for (let y = 0; y < H; y++) {
      const r = Math.floor(((H - 1 - y) / H) * ROWS);
      let m = -200;
      for (let f = f0; f < f1 && f < nFrames; f++) m = Math.max(m, cols[f][r]);
      const [cr, cg, cb] = color((m - (top - 80)) / 80), p = (y * W + x) * 4;
      img.data[p] = cr; img.data[p + 1] = cg; img.data[p + 2] = cb; img.data[p + 3] = 255;
    }
  }
  g.putImageData(img, X, Y);

  const secPerFrame = HOP / sr, totalCycles = nFrames * secPerFrame * cps;
  const cx = (c) => X + (c / totalCycles) * W;
  g.font = '12px ui-monospace, monospace'; g.textBaseline = 'middle';
  for (let c = 0; c <= Math.floor(totalCycles); c++) {
    const major = c % sectionCycles === 0;
    g.strokeStyle = major ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.12)';
    g.beginPath(); g.moveTo(cx(c) + 0.5, Y); g.lineTo(cx(c) + 0.5, LY + LH); g.stroke();
    if (major) { g.fillStyle = '#ddd'; g.fillText(String(c), cx(c) + 3, Y - 10); }
  }
  for (const hz of [50, 100, 250, 500, 1000, 2000, 4000, 8000, 16000]) {
    const y = Y + H - (Math.log(hz / FMIN) / Math.log(FMAX / FMIN)) * H;
    g.strokeStyle = 'rgba(255,255,255,0.15)'; g.beginPath(); g.moveTo(X, y); g.lineTo(X + W, y); g.stroke();
    g.fillStyle = '#aaa'; g.fillText(hz >= 1000 ? `${hz / 1000}k` : String(hz), 4, y);
  }

  // level lane: frame RMS from -60 to 0 dBFS, attacks as ticks, clipping in red
  g.fillStyle = '#16161a'; g.fillRect(X, LY, W, LH);
  const ly = (d) => LY + LH - ((Math.max(-60, Math.min(0, d)) + 60) / 60) * LH;
  for (const d of [-48, -36, -24, -12]) {
    g.strokeStyle = 'rgba(255,255,255,0.1)'; g.beginPath(); g.moveTo(X, ly(d)); g.lineTo(X + W, ly(d)); g.stroke();
    g.fillStyle = '#888'; g.fillText(String(d), 14, ly(d));
  }
  g.fillStyle = 'rgba(111,220,140,0.55)'; g.beginPath(); g.moveTo(X, LY + LH);
  for (let f = 0; f < nFrames; f++) g.lineTo(X + (f / nFrames) * W, ly(frameDb[f]));
  g.lineTo(X + W, LY + LH); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.6)';
  for (const f of onsetFrames) g.fillRect(X + (f / nFrames) * W, LY, 1, 6);
  g.fillStyle = '#ff5a5a';
  for (const f of clips) g.fillRect(X + (f / nFrames) * W, LY, 2, LH);
  g.fillStyle = '#ddd';
  sections.forEach((s, i) => g.fillText(`${s.rmsDb}dB nov ${s.novelty ?? '-'}`, cx(i * sectionCycles) + 3, LY + LH - 10));
  g.fillStyle = '#888'; g.fillText('cycles →', X + W - 70, Y - 10);
}

function report(r) {
  if (!r.global) return JSON.stringify(r, null, 2);
  const lines = [
    `global  ${r.global.seconds}s  ${r.global.cycles} cycles  ~${r.global.bpm} bpm  peak ${r.global.peakDb}  rms ${r.global.rmsDb}  crest ${r.global.crestDb}  width ${r.global.width}  silence ${r.global.silencePct}%  render ${r.global.renderMs}ms`,
    `bands%  ${Object.entries(r.global.bands).map(([k, v]) => `${k} ${v}`).join('  ')}`,
    '',
    'cycles   rms    peak   sub low mid high air  centroid  onsets/s  novelty',
    ...r.sections.map((s) => [s.cycles.padEnd(8), String(s.rmsDb).padStart(5), String(s.peakDb).padStart(6), ' ' + Object.values(s.bands).map((v) => String(v).padStart(3)).join(' '), String(s.centroidHz).padStart(9), String(s.onsetsPerSec).padStart(9), String(s.novelty ?? '-').padStart(8)].join(' ')),
    '',
    r.flags.length ? r.flags.map((f) => `FLAG ${f.id}: ${f.detail} → ${f.fix}`).join('\n') : 'no flags',
  ];
  if (r.missing?.length) lines.push(`MISSING ${r.missing.join(', ')}`);
  if (r.stems) lines.push('', 'stems (each layer alone)', ...r.stems.map((s) => `#${s.layer}  peak ${String(s.peakDb).padStart(5)}  rms ${String(s.rmsDb).padStart(6)}  sub+low ${r1(s.bands.sub + s.bands.low)}%  ${s.code}`));
  return lines.join('\n');
}

// ---------- comparison: renders of the same score, e.g. AI covers, against a reference ----------

const mean = (xs) => xs.reduce((a, b) => a + b, 0) / (xs.length || 1);
function pearson(a, b) {
  const ma = mean(a), mb = mean(b);
  let num = 0, da = 0, dbb = 0;
  for (let i = 0; i < a.length; i++) { num += (a[i] - ma) * (b[i] - mb); da += (a[i] - ma) ** 2; dbb += (b[i] - mb) ** 2; }
  return num / Math.sqrt(da * dbb || 1e-12);
}

// Did the render keep the score? Same energy per bar, same attacks at the same times.
function fidelity(ref, it) {
  const n = Math.min(ref.sections.length, it.sections.length);
  const a = ref.sections.slice(0, n).map((s) => s.rmsDb), b = it.sections.slice(0, n).map((s) => s.rmsDb);
  const offset = mean(b.map((v, i) => v - a[i]));
  let hits = 0, j = 0;
  const lags = [];
  for (const t of ref.onsets) {
    while (j < it.onsets.length && it.onsets[j] < t - 0.05) j++;
    if (j < it.onsets.length && Math.abs(it.onsets[j] - t) <= 0.05) { hits++; lags.push(it.onsets[j] - t); j++; }
  }
  const p = hits / (it.onsets.length || 1), r = hits / (ref.onsets.length || 1);
  return {
    secondsDiff: r1(it.global.seconds - ref.global.seconds),
    barLevelCorr: Math.round(pearson(a, b) * 100) / 100, // 1 = same energy curve
    levelOffsetDb: r1(offset),
    barLevelErrDb: r1(mean(b.map((v, i) => Math.abs(v - a[i] - offset)))),
    onsetF1: Math.round(((2 * p * r) / (p + r || 1)) * 100) / 100, // attacks within 50 ms of the reference
    medianLagMs: lags.length ? Math.round(lags.sort((x, y) => x - y)[lags.length >> 1] * 1000) : null,
  };
}

async function compare(paths, { bpm = 120, section = 1 } = {}) {
  const cps = bpm / 240, ctx = new OfflineAudioContext(2, 1, SR), items = [];
  $('spec').hidden = true;
  for (const path of paths) {
    status(`analysing ${path}…`);
    const buf = await ctx.decodeAudioData(await (await fetch(path, { cache: 'no-store' })).arrayBuffer());
    const fig = document.createElement('figure'), cap = document.createElement('figcaption'), au = document.createElement('audio');
    const cv = Object.assign(document.createElement('canvas'), { width: 1600, height: 640 }), pre = document.createElement('pre');
    cap.textContent = path;
    Object.assign(au, { controls: true, src: path });
    fig.append(cap, au, cv, pre);
    $('compare').append(fig);
    items.push({ path, pre, ...analyze(buf, cps, section, cv) });
  }
  const out = items.map((it, i) => {
    const fid = i ? fidelity(items[0], it) : null;
    it.pre.textContent = (fid ? `fidelity vs ${items[0].path}: ${JSON.stringify(fid)}\n\n` : 'reference\n\n') + report(it);
    return { path: it.path, fidelity: fid, global: it.global, flags: it.flags.map((f) => f.id) };
  });
  status(`compared ${items.length} files`, true);
  return (window.ear.result = out);
}

// Reimpose the reference's bar-by-bar level curve on another render: AI covers keep the timing but flatten the dynamics.
// Gains are interpolated between bar centres, clamped, then the result is normalised to a -1 dBFS peak and saved.
async function matchDynamics(refPath, path, outPath, { bpm = 120, maxBoostDb = 6, maxCutDb = 15 } = {}) {
  const cps = bpm / 240, ctx = new OfflineAudioContext(2, 1, SR);
  const load = async (p) => ctx.decodeAudioData(await (await fetch(p, { cache: 'no-store' })).arrayBuffer());
  const ref = await load(refPath), buf = await load(path);
  const a = analyze(ref, cps, 1, null).sections.map((s) => s.rmsDb), b = analyze(buf, cps, 1, null).sections.map((s) => s.rmsDb);
  const n = Math.min(a.length, b.length), ma = mean(a.slice(0, n)), mb = mean(b.slice(0, n));
  const gainDb = Array.from({ length: n }, (_, i) => Math.max(-maxCutDb, Math.min(maxBoostDb, a[i] - ma - (b[i] - mb))));
  const barLen = SR / cps, out = new AudioBuffer({ numberOfChannels: 2, length: buf.length, sampleRate: SR });
  let peak = 0;
  for (let c = 0; c < 2; c++) {
    const src = buf.getChannelData(Math.min(c, buf.numberOfChannels - 1)), dst = out.getChannelData(c);
    for (let i = 0; i < src.length; i++) {
      const x = i / barLen - 0.5, k = Math.max(0, Math.min(n - 1, Math.floor(x))), t = Math.max(0, Math.min(1, x - k));
      dst[i] = src[i] * 10 ** ((gainDb[k] + (gainDb[Math.min(n - 1, k + 1)] - gainDb[k]) * t) / 20);
      peak = Math.max(peak, Math.abs(dst[i]));
    }
  }
  return { status: await putNormalized(out, outPath, peak), gainDb: gainDb.map(r1) };
}

// Normalise to a -1 dBFS peak and save through serve.py.
async function putNormalized(buf, path, peak) {
  peak ??= Math.max(...[0, 1].map((c) => buf.getChannelData(c).reduce((m, v) => Math.max(m, Math.abs(v)), 0)));
  const norm = 10 ** (-1 / 20) / (peak || 1);
  for (let c = 0; c < 2; c++) buf.getChannelData(c).forEach((v, i, d) => (d[i] = v * norm));
  return (await fetch(path, { method: 'PUT', body: new Blob([wav(buf)], { type: 'audio/wav' }) })).status;
}

// Render groups of `$:` layers (1-based, in file order) as separate buses, unnormalised so they sum back to the mix.
async function renderBuses(code, buses, dir, { cycles } = {}) {
  const repl = await ready, lines = code.split('\n');
  const starts = lines.flatMap((l, i) => (/^\s*\$:/.test(l) ? [i] : []));
  cycles ??= Math.min(header(code, 'cycles') ?? 16, MAX_CYCLES);
  const out = {};
  for (const [name, layers] of Object.entries(buses)) {
    status(`bus ${name}…`);
    const solo = lines.map((l, i) => (starts.includes(i) && !layers.includes(starts.indexOf(i) + 1) ? l.replace('$:', '_$:') : l)).join('\n');
    repl.scheduler.setCps(0.5);
    const pattern = await repl.evaluate(solo, false);
    const buf = pattern && (await renderChunks(pattern, repl.scheduler.cps, cycles));
    out[name] = buf ? (await fetch(`${dir}/${name}.wav`, { method: 'PUT', body: new Blob([wav(buf)], { type: 'audio/wav' }) })).status : 'render failed';
  }
  status('buses saved', true);
  return out;
}

// Sum WAV files aligned at 0 with per-file gains in dB, normalise, save.
async function mix(tracks, outPath) {
  const ctx = new OfflineAudioContext(2, 1, SR);
  const bufs = [];
  for (const t of tracks) bufs.push({ ...t, buf: await ctx.decodeAudioData(await (await fetch(t.path, { cache: 'no-store' })).arrayBuffer()) });
  const out = new AudioBuffer({ numberOfChannels: 2, length: Math.max(...bufs.map((b) => b.buf.length)), sampleRate: SR });
  for (const { buf, gainDb = 0 } of bufs) {
    const g = 10 ** (gainDb / 20);
    for (let c = 0; c < 2; c++) {
      const src = buf.getChannelData(Math.min(c, buf.numberOfChannels - 1)), dst = out.getChannelData(c);
      for (let i = 0; i < src.length; i++) dst[i] += src[i] * g;
    }
  }
  return putNormalized(out, outPath);
}

// Save the last render next to the tracks (needs serve.py, which accepts PUT of .wav files).
const save = async (path) => (await fetch(path, { method: 'PUT', body: lastWav })).status;

async function renderFile(path, opts) {
  const code = await (await fetch(new URL(path, location.href), { cache: 'no-store' })).text();
  return render(code, opts);
}

window.ear = { ready, render, renderFile, renderBuses, mix, compare, matchDynamics, save, result: null, last: null };
$('go').onclick = () => (window.ear.last = render());
ready.then(() => status('ready'));

const q = new URLSearchParams(location.search);
if (q.get('compare')) window.ear.last = compare(q.get('compare').split(','), { bpm: Number(q.get('bpm')) || undefined, section: Number(q.get('section')) || undefined });
else if (q.get('file')) window.ear.last = renderFile(q.get('file'), { cycles: Number(q.get('cycles')) || undefined, section: Number(q.get('section')) || undefined, stems: q.has('stems') });
</script>
